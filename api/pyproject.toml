[project]
name = "bahi-api"
version = "0.1.0"
description = "BAHI - the two-sided udhaar ledger"
requires-python = ">=3.13"
dependencies = [
    "cognee[postgres]==1.6.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
]

[tool.ruff]
line-length = 90
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Starlette would like TestClient to move to httpx2; the tests do not care which.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
